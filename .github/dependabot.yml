version: 2

# Feature work merges into dev and reaches main only at a release, so version
# updates target dev to keep the two branches from drifting apart. Bumps that
# landed straight on main previously conflicted with dev at release time.
#
# Note: this file is only read from the default branch (main), and Dependabot
# SECURITY updates always target the default branch regardless of the setting
# below - so security PRs will still open against main.
updates:
  - package-ecosystem: "nuget"
    directory: "/src/MultiRoomAudio"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Swashbuckle.AspNetCore 9+ pulls Microsoft.OpenApi 2.x, whose flattened
      # namespace conflicts at runtime with Microsoft.AspNetCore.OpenApi 8.x
      # (used via .WithOpenApi()), which references Microsoft.OpenApi 1.x types.
      # The major bump compiles but throws TypeLoadException at startup. Hold it
      # until the project targets net9/net10. See #216.
      - dependency-name: "Swashbuckle.AspNetCore"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
