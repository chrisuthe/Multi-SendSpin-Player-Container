configuration:
  log_level:
    name: Log Level
    description: >-
      Set the logging verbosity for the add-on.
      Debug provides the most detail for troubleshooting.
  reset_sinks:
    name: Reset Audio Sinks
    description: >-
      Suspend and resume each sound card's sink at startup, whenever a sink
      appears, and after a card profile change. Works around a kernel bug where a
      card accepts audio but plays nothing until it is cycled. Turning this off
      disables all three, and affected cards will need cycling by hand.
